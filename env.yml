name: pathstar
channels:
  - conda-forge
  - defaults

dependencies:
  # Core scientific stack
  - python=3.10
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.9
  - scikit-learn>=1.2
  - matplotlib>=3.6
  - seaborn>=0.12

  # Optional but recommended for faster I/O
  - pyarrow>=11

  # Utilities
  - tqdm
  - ipykernel
  - jupyterlab

  # Pip fallback section (for rare extras)
  - pip
  - pip:
      - statsmodels
      - tabulate
